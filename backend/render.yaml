# Render Blueprint — used when Root Directory is `backend`,
# or copy this file to the repo root and set rootDir: backend.
# https://render.com/docs/blueprint-spec

databases:
  - name: ai-erp-pos-db
    plan: free
    databaseName: erp_pos
    user: erp_pos

services:
  - type: web
    name: ai-erp-pos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-erp-pos-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
